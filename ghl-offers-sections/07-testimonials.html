<!-- ===== 07 CLIENT TESTIMONIALS (1 video + 3 image testimonials) ===== -->
<!-- GHL: paste into a Custom Code element. Section + row + column: full width, 0 padding. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* MRJ base (same in every section, safe to repeat) */
.mrj{--paper:#FFF8CA;--card:#FFFDF0;--ink:#2D120D;--ink-soft:#6B4A42;--line:#E6D9A8;--tint:#CDE3E8;--gold:#6B0B0C;--gold-deep:#6B0B0C;--on-dark:#FFF8CA;--dark-soft:#E3D3C8;--shadow:45,18,13;--display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"Figtree","Helvetica Neue",Arial,sans-serif;--accent-serif:"Instrument Serif",Georgia,serif;--wrap:1170px;width:auto;max-width:none;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);position:relative;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;text-align:left}
html,body{overflow-x:clip}
.mrj :where(*),.mrj :where(*)::before,.mrj :where(*)::after{box-sizing:border-box}
.mrj :where(img,video){max-width:100%;display:block}
.mrj :where(a){color:inherit}
.mrj :where(p){margin:0}
.mrj :where(a:focus-visible,button:focus-visible){outline:3px solid var(--tint);box-shadow:0 0 0 5px var(--gold);outline-offset:3px;border-radius:6px}
.mrj :where(.wrap){max-width:var(--wrap);margin:0 auto;padding:0 24px}
.mrj :where(h1,h2,h3){font-family:var(--display);line-height:1.05;letter-spacing:-.025em;margin:0;text-wrap:balance;color:inherit;text-transform:none}
.mrj :where(em.s){font-family:var(--accent-serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.mrj :where(.eyebrow){font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.mrj :where(.btn){white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--body);font-weight:700;text-decoration:none;font-size:15px;line-height:1.2;border:2px solid var(--ink);transition:transform .15s ease,background .15s}
.mrj :where(.btn:hover){transform:translateY(-2px)}
.mrj :where(.btn.gold){background:var(--gold);border-color:var(--gold);color:var(--paper)}
.mrj :where(.btn.ghost){background:transparent;color:var(--ink)}
.mrj :where(.btn.small){padding:9px 16px;font-size:14px}
.mrj :where(.sec-head){display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:24px}
.mrj :where(.sec-head h2){font-size:clamp(36px,5vw,64px);font-weight:800}
.mrj :where(.sec-head p){max-width:42ch;color:var(--ink-soft);margin:0}
.mrj :where([id]){scroll-margin-top:80px}
@media (prefers-reduced-motion:reduce){.mrj *{animation:none!important;transition:none!important}}
</style>
<style>
.mrj{--rose:#6B0B0C;--serif:var(--accent-serif)}
.mrj :where(.chip){display:inline-block;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--tint);color:var(--ink);line-height:1.4}

.mrj :where(.samples){margin-top:72px}
.mrj :where(.samples-head){display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.mrj :where(.samples-head h3){font-size:clamp(24px,2.6vw,32px);font-weight:700}
.mrj :where(.samples-head p){color:var(--ink-soft);font-size:15px}
.mrj :where(.shot){position:relative;display:block;width:100%;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 22px 44px -26px rgba(var(--shadow),.4);cursor:zoom-in;text-align:left;font:inherit;color:inherit;transition:transform .15s}
.mrj :where(.shot:hover){transform:translateY(-3px)}
.mrj :where(.shot img){width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top}
.mrj :where(.shot .meta){display:block;padding:12px 14px;font-size:13.5px;color:var(--ink-soft);border-top:1px solid var(--line)}
.mrj :where(.shot .meta b){display:block;color:var(--ink);font-size:15px}
.mrj :where(.shot .open){position:absolute;right:10px;top:10px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px}
.mrj :where(dialog.lb){border:0;padding:0;width:min(1000px,94vw);height:90vh;max-height:90vh;border-radius:16px;background:var(--card);box-shadow:0 40px 80px rgba(0,0,0,.5);overflow:hidden}
.mrj :where(dialog.lb)::backdrop{background:rgba(45,18,13,.8)}
.mrj :where(.lb-head){display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--ink);color:#fff;font-weight:700;font-size:15px}
.mrj :where(.lb-head button){background:var(--on-dark);color:var(--ink);border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
.mrj :where(.lb-body){height:calc(90vh - 56px);overflow:auto}
.mrj :where(.lb-body img){width:100%;display:block}

.mrj.mrj-testi{padding:104px 0;background:var(--ink);color:var(--paper)}
.mrj-testi .eyebrow{color:var(--dark-soft)}
.mrj-testi .top{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.mrj-testi h2{font-size:clamp(34px,4.6vw,58px);font-weight:800;margin-top:14px;max-width:16ch}
.mrj-testi h2 .g{color:var(--tint)}
.mrj-testi .intro{color:var(--dark-soft);font-size:18px;max-width:44ch;margin-top:18px}
.mrj-testi .vid{background:#000;border-radius:20px;overflow:hidden;border:6px solid rgba(255,248,202,.12);box-shadow:0 40px 70px -30px rgba(0,0,0,.7)}
.mrj-testi .vid video{width:100%;max-height:600px;object-fit:contain;background:#000}
.mrj-testi .who{display:flex;align-items:center;gap:12px;margin-top:16px}
.mrj-testi .who .play{width:36px;height:36px;border-radius:50%;background:var(--on-dark);color:var(--ink);display:grid;place-items:center;font-size:13px;flex:none}
.mrj-testi .who b{display:block;font-family:var(--display);font-size:18px;line-height:1.2}
.mrj-testi .who span{font-size:14.5px;color:var(--dark-soft)}
.mrj-testi .imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:56px;align-items:start}
.mrj-testi .shot{background:var(--card);border:0;box-shadow:0 30px 50px -30px rgba(0,0,0,.6)}
.mrj-testi .shot img{aspect-ratio:auto;object-fit:contain;background:#fff}
.mrj-testi .shot .open{top:auto;bottom:10px}
.mrj-testi .shot .meta{color:var(--ink-soft)}
@media (max-width:900px){.mrj-testi .top{grid-template-columns:1fr}.mrj-testi .imgs{grid-template-columns:1fr;max-width:520px}}
</style>
<section class="mrj mrj-testi" id="testimonials" aria-labelledby="testi-h">
  <div class="wrap">
    <div class="top">
      <div>
        <div class="vid">
          <!-- Replace with your video testimonial (Media Library URL) and a cover image -->
          <video src="img/testimonial-video.mp4" poster="img/testimonial-video-poster.jpg" controls playsinline preload="metadata" aria-label="Video testimonial from [Client name]"></video>
        </div>
        <div class="who"><span class="play" aria-hidden="true">▶</span><div><b>[Client name]</b><span>[Role, Business name]</span></div></div>
      </div>
      <div>
        <div class="eyebrow">Client testimonials</div>
        <h2 id="testi-h">Don't take my word for it. <span class="g">Take theirs.</span></h2>
        <p class="intro">Coaches, gyms and service businesses I've built pages and content for, in their own words.</p>
      </div>
    </div>
    <!-- Replace each testimonial image (src AND data-full) plus the name and business under it -->
    <div class="imgs">
      <button class="shot" type="button" data-full="img/testimonial-1.jpg" data-title="Testimonial from [Client name]"><img src="img/testimonial-1.jpg" alt="Testimonial from [Client name], [Business name]"><span class="meta"><b>[Client name]</b>[Business name]</span><span class="open">Enlarge ↗</span></button>
      <button class="shot" type="button" data-full="img/testimonial-2.jpg" data-title="Testimonial from [Client name]"><img src="img/testimonial-2.jpg" alt="Testimonial from [Client name], [Business name]"><span class="meta"><b>[Client name]</b>[Business name]</span><span class="open">Enlarge ↗</span></button>
      <button class="shot" type="button" data-full="img/testimonial-3.jpg" data-title="Jeannie Vo and the Habitat Gym team"><img src="img/testimonial-3.jpg" alt="WhatsApp messages from Jeannie Vo and the Habitat Gym team praising the new pages"><span class="meta"><b>Jeannie Vo &amp; team</b>Habitat Gym · Sydney</span><span class="open">Enlarge ↗</span></button>
    </div>
  </div>
</section>
<script>
(function(){
  var lb=document.getElementById('mrj-lb');
  if(!lb){
    var w=document.createElement('div');w.className='mrj mrj-lbwrap';w.style.height='0';
    w.innerHTML='<dialog class="lb" id="mrj-lb" aria-labelledby="mrj-lb-title"><div class="lb-head"><span id="mrj-lb-title">Full page</span><button type="button" id="mrj-lb-close">Close</button></div><div class="lb-body"><img id="mrj-lb-img" alt=""></div></dialog>';
    document.body.appendChild(w);lb=document.getElementById('mrj-lb');
    document.getElementById('mrj-lb-close').addEventListener('click',function(){lb.close();});
    lb.addEventListener('click',function(e){if(e.target===lb)lb.close();});
  }
  var img=document.getElementById('mrj-lb-img'),t=document.getElementById('mrj-lb-title');
  document.querySelectorAll('.mrj .shot[data-full]').forEach(function(b){
    if(b.dataset.lbBound)return; b.dataset.lbBound='1';
    b.addEventListener('click',function(){
      img.src=b.dataset.full;img.alt=b.dataset.title;t.textContent=b.dataset.title;
      lb.querySelector('.lb-body').scrollTop=0;
      if(lb.showModal){lb.showModal();}else{lb.setAttribute('open','');}
    });
  });
})();
</script>

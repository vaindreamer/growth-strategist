<!-- ===== 01 HEADER (simple brand bar) ===== -->
<!-- GHL: paste into a Custom Code element. Section + row + column: full width, 0 padding. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* MRJ base (same in every section, safe to repeat) */
.mrj{--paper:#FFF8CA;--card:#FFFDF0;--ink:#2D120D;--ink-soft:#6B4A42;--line:#E6D9A8;--tint:#CDE3E8;--gold:#6B0B0C;--gold-deep:#6B0B0C;--on-dark:#FFF8CA;--dark-soft:#E3D3C8;--shadow:45,18,13;--display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"Figtree","Helvetica Neue",Arial,sans-serif;--accent-serif:"Instrument Serif",Georgia,serif;--wrap:1170px;width:auto;max-width:none;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);position:relative;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;text-align:left}
html,body{overflow-x:clip}
.mrj :where(*),.mrj :where(*)::before,.mrj :where(*)::after{box-sizing:border-box}
.mrj :where(img,video){max-width:100%;display:block}
.mrj :where(a){color:inherit}
.mrj :where(p){margin:0}
.mrj :where(a:focus-visible,button:focus-visible){outline:3px solid var(--tint);box-shadow:0 0 0 5px var(--gold);outline-offset:3px;border-radius:6px}
.mrj :where(.wrap){max-width:var(--wrap);margin:0 auto;padding:0 24px}
.mrj :where(h1,h2,h3){font-family:var(--display);line-height:1.05;letter-spacing:-.025em;margin:0;text-wrap:balance;color:inherit;text-transform:none}
.mrj :where(em.s){font-family:var(--accent-serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.mrj :where(.eyebrow){font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.mrj :where(.btn){white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--body);font-weight:700;text-decoration:none;font-size:15px;line-height:1.2;border:2px solid var(--ink);transition:transform .15s ease,background .15s}
.mrj :where(.btn:hover){transform:translateY(-2px)}
.mrj :where(.btn.gold){background:var(--gold);border-color:var(--gold);color:var(--paper)}
.mrj :where(.btn.ghost){background:transparent;color:var(--ink)}
.mrj :where(.btn.small){padding:9px 16px;font-size:14px}
.mrj :where(.sec-head){display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:24px}
.mrj :where(.sec-head h2){font-size:clamp(36px,5vw,64px);font-weight:800}
.mrj :where(.sec-head p){max-width:42ch;color:var(--ink-soft);margin:0}
.mrj :where([id]){scroll-margin-top:80px}
@media (prefers-reduced-motion:reduce){.mrj *{animation:none!important;transition:none!important}}
</style>
<style>
.mrj{--rose:#6B0B0C}

.mrj-head{border-bottom:1px solid var(--line)}
.mrj-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.mrj-head .brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:10px}
.mrj-head .mark{width:30px;height:30px;border-radius:50%;background:var(--rose);color:var(--paper);display:grid;place-items:center;font-size:12px;letter-spacing:0}
.mrj-head .back{font-weight:600;font-size:15px;text-decoration:none}
.mrj-head .back:hover{color:var(--rose)}
@media (max-width:420px){.mrj-head .full{display:none}}
</style>
<div class="mrj mrj-head">
  <div class="wrap">
    <!-- Replace both # links with your offers / portfolio page URL -->
    <a class="brand" href="#"><span class="mark">MRJ</span><span class="full">The MRJ Creatives &amp; Co.</span></a>
    <a class="back" href="#">← Back to offers</a>
  </div>
</div>

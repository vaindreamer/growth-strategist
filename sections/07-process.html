<!-- ============================================================
     LEVEL UP TALENT SOLUTIONS — RPO LANDING PAGE
     Section 07: process
     Paste this entire block into a GoHighLevel "Custom Code" /
     "Custom HTML" element in this position on the page. The
     "lvlup-bleed" class below makes this section span the full
     browser width even if GHL's row/section wraps it in a
     narrower container — no manual width settings needed in GHL.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== LVLUP RPO LANDING PAGE — DESIGN SYSTEM =====
   This same <style> block is repeated at the top of every file in /sections/
   so each section can be pasted into GoHighLevel as an independent Custom
   Code element and still render correctly. Do not remove it from a section
   file when copying into GHL. */
:root{
  --navy:#004AAD;
  --navy-dark:#00337a;
  --blue:#0099FF;
  --gold:#FFB803;
  --white:#FFFFFF;
  --ink:#0A1A33;
  --gray-700:#3E4C63;
  --gray-500:#6B7A90;
  --gray-100:#F3F6FB;
  --gray-200:#E6ECF5;
  --radius:16px;
  --shadow:0 20px 45px -20px rgba(0,45,110,0.25);
  --container:1160px;
}
.lvlup *{box-sizing:border-box;}
.lvlup{
  font-family:'Roboto',Arial,sans-serif;
  color:var(--ink);
  line-height:1.6;
  background:var(--white);
}
.lvlup h1,.lvlup h2,.lvlup h3,.lvlup h4{
  font-family:'Poppins',Arial,sans-serif;
  color:var(--navy);
  line-height:1.2;
  margin:0 0 16px;
  font-weight:700;
}
.lvlup p{margin:0 0 16px;color:var(--gray-700);}
.lvlup a{text-decoration:none;}
.lvlup img{max-width:100%;display:block;}
.lvlup .container{max-width:var(--container);margin:0 auto;padding:0 24px;}
.lvlup .eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Poppins',Arial,sans-serif;
  font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--navy);background:var(--gray-100);
  padding:8px 16px;border-radius:999px;margin-bottom:18px;
}
.lvlup .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);}
.lvlup .btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Poppins',Arial,sans-serif;font-weight:600;font-size:16px;
  padding:16px 32px;border-radius:10px;border:2px solid transparent;
  cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  white-space:nowrap;
}
.lvlup .btn:hover{transform:translateY(-2px);}
.lvlup .btn-gold{background:var(--gold);color:var(--navy);box-shadow:0 12px 24px -10px rgba(255,184,3,0.6);}
.lvlup .btn-gold:hover{box-shadow:0 16px 30px -10px rgba(255,184,3,0.75);}
.lvlup .btn-outline{background:transparent;border-color:rgba(255,255,255,0.55);color:var(--white);}
.lvlup .btn-outline:hover{background:rgba(255,255,255,0.12);}
.lvlup .btn-navy{background:var(--navy);color:var(--white);}
.lvlup .btn-navy:hover{background:var(--navy-dark);}
.lvlup .btn-block{width:100%;}
.lvlup .cta-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;}
.lvlup .section{padding:88px 0;}
.lvlup .section-tight{padding:64px 0;}
.lvlup .section-head{max-width:680px;margin:0 auto 48px;text-align:center;}
.lvlup .section-head p{font-size:18px;}
.lvlup .bg-navy{background:var(--navy);color:var(--white);}
.lvlup .bg-navy h2,.lvlup .bg-navy h3,.lvlup .bg-navy h4{color:var(--white);}
.lvlup .bg-navy p{color:rgba(255,255,255,0.82);}
.lvlup .bg-gray{background:var(--gray-100);}
.lvlup .grid{display:grid;gap:28px;}
.lvlup .grid-2{grid-template-columns:repeat(2,1fr);}
.lvlup .grid-3{grid-template-columns:repeat(3,1fr);}
.lvlup .grid-4{grid-template-columns:repeat(4,1fr);}
.lvlup .card{
  background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:32px;box-shadow:var(--shadow);
}
.lvlup .badge-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--white);
  font-family:'Poppins',Arial,sans-serif;font-weight:700;font-size:18px;margin-bottom:16px;
}
.lvlup .icon-tile{
  width:56px;height:56px;border-radius:12px;background:var(--gray-100);
  display:flex;align-items:center;justify-content:center;margin-bottom:20px;
  font-size:26px;
}
.lvlup .divider-gold{width:64px;height:4px;background:var(--gold);border-radius:2px;margin:0 auto 24px;}
/* Breaks a section out of whatever fixed-width row/container GHL wraps it in,
   so it spans the full browser viewport regardless of the page builder's
   default content width. Inner .container still centers content normally. */
.lvlup-bleed{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;}
body{overflow-x:hidden;}
.lvlup .lvlup-step-btn{
  width:52px;height:52px;border-radius:50%;border:none;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:'Poppins',Arial,sans-serif;font-weight:700;font-size:18px;
  cursor:pointer;background:rgba(255,255,255,0.12);color:var(--white);
  transition:transform .2s ease,background .2s ease,color .2s ease;
}
.lvlup .lvlup-step-btn:hover{transform:scale(1.08);}
.lvlup .lvlup-step-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
.lvlup .lvlup-step-line{flex:1;height:3px;min-width:24px;border-radius:2px;background:rgba(255,255,255,0.2);transition:background .2s ease;}
@media(prefers-reduced-motion: reduce){
  .lvlup .lvlup-step-btn,.lvlup .lvlup-step-line{transition:none;}
}
.lvlup .lvlup-tier-btn{
  font-family:'Poppins',Arial,sans-serif;font-weight:600;font-size:14px;
  padding:12px 18px;border-radius:999px;border:2px solid var(--gray-200);
  background:var(--white);color:var(--navy);cursor:pointer;white-space:nowrap;
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
}
.lvlup .lvlup-tier-btn:hover{transform:translateY(-2px);border-color:var(--navy);}
.lvlup .lvlup-tier-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.lvlup .lvlup-tier-btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--white);}
@media(prefers-reduced-motion: reduce){
  .lvlup .lvlup-tier-btn{transition:none;}
}
.lvlup .lvlup-value-btn{
  width:56px;height:56px;border-radius:50%;border:2px solid var(--gray-200);flex:none;
  background:var(--white);color:var(--navy);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:'Poppins',Arial,sans-serif;font-weight:800;font-size:22px;
  transition:transform .18s ease,background .18s ease,color .18s ease,border-color .18s ease;
}
.lvlup .lvlup-value-btn:hover{transform:translateY(-3px);border-color:var(--navy);}
.lvlup .lvlup-value-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.lvlup .lvlup-value-btn[aria-pressed="true"]{background:var(--navy);border-color:var(--gold);color:var(--gold);transform:scale(1.1);}
@media(prefers-reduced-motion: reduce){
  .lvlup .lvlup-value-btn{transition:none;}
}
/* Every .card across the page (services, problem, why-us, industries,
   stats, testimonials, engagement models, FAQ) lifts on hover so the
   whole page feels responsive to the cursor, not just the process steps. */
.lvlup .card{transition:transform .18s ease,box-shadow .18s ease;}
.lvlup .card:hover{transform:translateY(-4px);box-shadow:0 28px 55px -22px rgba(0,45,110,0.32);}
/* Trust-bar logo placeholders */
.lvlup .lvlup-logo-slot{border:1px dashed var(--gray-200);border-radius:12px;padding:22px;text-align:center;color:var(--gray-500);font-family:'Poppins',Arial,sans-serif;font-weight:600;transition:border-color .18s ease,color .18s ease,transform .18s ease;}
.lvlup .lvlup-logo-slot:hover{border-color:var(--navy);color:var(--navy);transform:translateY(-2px);}
/* Underline-on-hover for header/footer nav links */
.lvlup .lvlup-nav-links{display:flex;align-items:center;gap:28px;}
.lvlup .lvlup-nav-links > a:not(.btn){position:relative;}
.lvlup .lvlup-nav-links > a:not(.btn)::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .18s ease;}
.lvlup .lvlup-nav-links > a:not(.btn):hover::after{transform:scaleX(1);}
.lvlup .lvlup-footer-link{transition:color .18s ease;}
.lvlup .lvlup-footer-link:hover{color:var(--gold) !important;}
/* Mobile header nav: hamburger toggle + slide-down menu */
.lvlup .lvlup-nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:44px;height:44px;background:none;border:none;cursor:pointer;padding:0;flex:none;}
.lvlup .lvlup-nav-toggle span{display:block;width:24px;height:2px;background:var(--navy);border-radius:2px;transition:transform .2s ease,opacity .2s ease;}
.lvlup .lvlup-nav-toggle.lvlup-nav-toggle-open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.lvlup .lvlup-nav-toggle.lvlup-nav-toggle-open span:nth-child(2){opacity:0;}
.lvlup .lvlup-nav-toggle.lvlup-nav-toggle-open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
@media(max-width:800px){
  .lvlup .lvlup-nav-toggle{display:flex;}
  .lvlup .lvlup-nav-links{
    position:absolute;top:100%;left:0;right:0;margin:0;
    flex-direction:column;align-items:stretch;gap:0;
    background:var(--white);border-bottom:1px solid var(--gray-200);
    max-height:0;overflow:hidden;transition:max-height .25s ease;
  }
  .lvlup .lvlup-nav-links.lvlup-nav-open{max-height:320px;}
  .lvlup .lvlup-nav-links > a:not(.btn){padding:14px 24px;border-top:1px solid var(--gray-200);}
  .lvlup .lvlup-nav-links > a:not(.btn)::after{display:none;}
  .lvlup .lvlup-nav-links > a.btn{margin:14px 24px;display:flex;justify-content:center;}
}
/* FAQ: custom +/x indicator instead of the browser's default marker */
.lvlup details.card{padding:0;}
.lvlup details.card summary{list-style:none;cursor:pointer;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.lvlup details.card summary::-webkit-details-marker{display:none;}
.lvlup details.card summary::after{content:'+';font-family:'Poppins',Arial,sans-serif;font-weight:700;font-size:22px;color:var(--navy);flex:none;line-height:1;transition:transform .18s ease;}
.lvlup details[open].card summary::after{transform:rotate(45deg);}
.lvlup details.card > p{padding:0 26px 22px;margin-top:0 !important;}
@media(prefers-reduced-motion: reduce){
  .lvlup .card,.lvlup .lvlup-logo-slot,.lvlup .lvlup-nav-links > a:not(.btn)::after,.lvlup .lvlup-footer-link,.lvlup .lvlup-nav-toggle span,.lvlup .lvlup-nav-links,.lvlup details.card summary::after{transition:none;}
}
@media(max-width:900px){
  .lvlup .grid-4{grid-template-columns:repeat(2,1fr);}
  .lvlup .grid-3{grid-template-columns:repeat(2,1fr);}
  .lvlup .grid-2{grid-template-columns:1fr;}
}
@media(max-width:640px){
  .lvlup .section{padding:56px 0;}
  .lvlup .grid-4,.lvlup .grid-3{grid-template-columns:1fr;}
  .lvlup h1{font-size:34px !important;}
  .lvlup h2{font-size:28px !important;}
}
</style>
<div class="lvlup lvlup-bleed">
<section class="section bg-navy" id="process">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow" style="background:rgba(255,255,255,0.1);color:var(--white);">How It Works</span>
      <h2 style="font-size:34px;">From Kickoff to Offer, in Five Steps</h2>
      <p>A clear, repeatable process so you always know what's happening and when.</p>
    </div>
    <div id="lvlup-process" style="max-width:900px;margin:0 auto;">
      <div style="display:flex;align-items:flex-start;gap:2px;overflow-x:auto;padding:4px 4px 12px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;flex:none;width:110px;">
          <button type="button" class="lvlup-step-btn" data-step="1" aria-pressed="true" aria-controls="lvlup-step-panel">1</button>
          <span style="font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:600;color:rgba(255,255,255,0.75);text-align:center;">Discovery</span>
        </div>
        <div class="lvlup-step-line" style="margin-top:26px;"></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;flex:none;width:110px;">
          <button type="button" class="lvlup-step-btn" data-step="2" aria-pressed="false" aria-controls="lvlup-step-panel">2</button>
          <span style="font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:600;color:rgba(255,255,255,0.75);text-align:center;">Sourcing</span>
        </div>
        <div class="lvlup-step-line" style="margin-top:26px;"></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;flex:none;width:110px;">
          <button type="button" class="lvlup-step-btn" data-step="3" aria-pressed="false" aria-controls="lvlup-step-panel">3</button>
          <span style="font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:600;color:rgba(255,255,255,0.75);text-align:center;">Pipeline</span>
        </div>
        <div class="lvlup-step-line" style="margin-top:26px;"></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;flex:none;width:110px;">
          <button type="button" class="lvlup-step-btn" data-step="4" aria-pressed="false" aria-controls="lvlup-step-panel">4</button>
          <span style="font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:600;color:rgba(255,255,255,0.75);text-align:center;">Interview</span>
        </div>
        <div class="lvlup-step-line" style="margin-top:26px;"></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;flex:none;width:110px;">
          <button type="button" class="lvlup-step-btn" data-step="5" aria-pressed="false" aria-controls="lvlup-step-panel">5</button>
          <span style="font-family:'Poppins',Arial,sans-serif;font-size:12px;font-weight:600;color:rgba(255,255,255,0.75);text-align:center;">Onboarding</span>
        </div>
      </div>

      <div id="lvlup-step-panel" class="card" aria-live="polite" style="margin-top:24px;background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.18);">
        <span class="eyebrow" id="lvlup-step-label" style="background:rgba(255,255,255,0.12);color:var(--gold);">Step 1 of 5</span>
        <h3 id="lvlup-step-title" style="color:var(--white);font-size:22px;">Discovery &amp; Role Scoping</h3>
        <p id="lvlup-step-desc" style="margin:0;font-size:16px;">We map your roles, hiring bar, timeline, and target candidate profile.</p>
      </div>
    </div>
  </div>
</section>
<script>
(function(){
  var steps=[
    {title:"Discovery & Role Scoping",desc:"We map your roles, hiring bar, timeline, and target candidate profile."},
    {title:"Sourcing Strategy",desc:"A custom sourcing and outreach plan tailored to your market and role level."},
    {title:"Pipeline Delivery",desc:"Qualified candidates delivered on a set cadence, with full visibility into every stage."},
    {title:"Interview & Offer Support",desc:"We coordinate interviews and manage offer negotiation to get to “yes” faster."},
    {title:"Onboarding & Optimization",desc:"Smooth handoff at signing, plus ongoing reporting to keep improving results."}
  ];
  var root=document.getElementById('lvlup-process');
  if(!root)return;
  var buttons=root.querySelectorAll('.lvlup-step-btn');
  var lines=root.querySelectorAll('.lvlup-step-line');
  var labelEl=document.getElementById('lvlup-step-label');
  var titleEl=document.getElementById('lvlup-step-title');
  var descEl=document.getElementById('lvlup-step-desc');
  function setActive(n){
    buttons.forEach(function(btn){
      var active=parseInt(btn.getAttribute('data-step'),10)===n;
      btn.setAttribute('aria-pressed',active?'true':'false');
      btn.style.background=active?'var(--gold)':'rgba(255,255,255,0.12)';
      btn.style.color=active?'var(--navy)':'var(--white)';
      btn.style.transform=active?'scale(1.1)':'scale(1)';
    });
    lines.forEach(function(line,i){
      line.style.background=(i<n-1)?'var(--gold)':'rgba(255,255,255,0.2)';
    });
    var s=steps[n-1];
    labelEl.textContent='Step '+n+' of 5';
    titleEl.textContent=s.title;
    descEl.textContent=s.desc;
  }
  buttons.forEach(function(btn){
    btn.addEventListener('click',function(){setActive(parseInt(btn.getAttribute('data-step'),10));});
  });
  setActive(1);
})();
</script>
</div>

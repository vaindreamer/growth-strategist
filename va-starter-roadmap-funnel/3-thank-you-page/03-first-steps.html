<!-- VA Starter Roadmap · Thank you + access · 03-first-steps
     Paste into a GHL Custom JS/HTML element (full-width section, row/column padding 0). -->
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&display=swap');
.vsr{--ink:#400106;--wine:#800f1d;--rose:#ff2487;--rose-d:#c4126a;--cream:#f7f0ea;--paper:#fbf8f4;--text:#1f1919;--muted:#5c4f4f;--line:rgba(64,1,6,.12);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:18px;line-height:1.6;color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased;width:100%;box-sizing:border-box}
.vsr *,.vsr *::before,.vsr *::after{box-sizing:border-box}
:where(.vsr) :where(h1,h2,h3,p,ul,ol){margin:0;padding:0}
.vsr h1,.vsr h2,.vsr h3{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.02em;line-height:1.08;color:var(--ink)}
.vsr a{color:var(--ink)}
.vsr-white{background:#fff}
.vsr-dark{background:var(--ink);color:var(--cream)}
.vsr-dark h1,.vsr-dark h2,.vsr-dark h3{color:#fff}
.vsr-wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.vsr-sec{padding:104px 0}
.vsr-eyebrow{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-d);margin-bottom:20px}
.vsr-eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.vsr-dark .vsr-eyebrow{color:var(--rose)}
.vsr-center{text-align:center}
.vsr-center .vsr-eyebrow{justify-content:center}
.vsr-h2{font-size:clamp(32px,4.2vw,48px);max-width:22ch;margin-bottom:18px}
.vsr-lead{max-width:62ch;color:var(--muted)}
.vsr-dark .vsr-lead{color:rgba(247,240,234,.8)}
.vsr-btn{display:inline-block;background:var(--rose);color:#fff!important;text-decoration:none!important;font-weight:700;font-size:18px;line-height:1.2;padding:18px 34px;border-radius:999px;transition:background .2s,transform .2s}
.vsr-btn:hover{background:#e0157a;transform:translateY(-1px)}
.vsr-btn--ink{background:var(--ink)}
.vsr-btn--ink:hover{background:var(--wine)}
.vsr a:focus-visible,.vsr summary:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
@media (max-width:720px){.vsr{font-size:17px}.vsr-sec{padding:72px 0}.vsr-wrap{padding:0 20px}}
.vsr-steps{padding-top:0}
.vsr-steps__inner{max-width:1040px}
.vsr-steps__list{list-style:none;counter-reset:vsr-step;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px}
.vsr-steps__list li{counter-increment:vsr-step;border-top:1px solid var(--line);padding-top:24px;color:var(--muted)}
.vsr-steps__list li::before{content:counter(vsr-step,decimal-leading-zero);display:block;font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:15px;letter-spacing:.08em;color:var(--rose-d);margin-bottom:12px}
.vsr-steps__list b{display:block;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px;line-height:1.25;color:var(--ink);margin-bottom:6px}
@media (max-width:820px){.vsr-steps__list{grid-template-columns:1fr}}
</style>
<section class="vsr vsr-sec vsr-steps">
  <div class="vsr-wrap vsr-steps__inner">
    <div class="vsr-eyebrow">Do this today</div>
    <h2 class="vsr-h2">Your first 3 steps, today</h2>
    <ol class="vsr-steps__list">
      <li><b>Read “Start here”</b>Then sign the commitment on the last page.</li>
      <li><b>Do Worksheet 1</b>The skills inventory. It takes 20 minutes.</li>
      <li><b>Block Day 1 to Day 30</b>Put them in your calendar at the same time every day.</li>
    </ol>
  </div>
</section>
